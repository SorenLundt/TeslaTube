<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TeslaTube</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: #101114; color: #f5f5f5;
      font: 16px/1.5 Arial, Helvetica, sans-serif;
      display: flex; justify-content: center; padding: 28px 16px;
    }
    main { width: min(900px, 100%); }
    header { text-align: center; margin: 12px 0 28px; }
    h1 { margin: 0; font-size: clamp(34px, 7vw, 56px); letter-spacing: -2px; }
    h1 span { color: #e82127; }
    .tagline { color: #aaa; margin-top: 6px; }
    .search { display: flex; gap: 10px; margin: 22px 0 14px; }
    input {
      flex: 1; min-width: 0; padding: 15px 16px; border-radius: 9px;
      border: 1px solid #444; background: #1d1f23; color: white; font-size: 16px;
    }
    button, .youtube-link {
      border: 0; border-radius: 9px; padding: 0 20px; background: #e82127;
      color: white; font-weight: bold; font-size: 15px; cursor: pointer;
      text-decoration: none; display: inline-flex; align-items: center; justify-content: center;
      min-height: 50px;
    }
    .youtube-link { background: #292b30; margin-bottom: 20px; }
    .player {
      position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000;
      border-radius: 12px; overflow: hidden; border: 1px solid #333;
    }
    iframe { width: 100%; height: 100%; border: 0; }
    .placeholder {
      position: absolute; inset: 0; display: grid; place-items: center;
      color: #888; text-align: center; padding: 20px;
    }
    .notice {
      margin-top: 18px; padding: 13px 15px; border-radius: 9px;
      background: #252015; color: #e8d8a9; font-size: 14px;
    }
    @media (max-width: 560px) {
      .search { flex-direction: column; }
      button { min-height: 48px; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Tesla<span>Tube</span></h1>
    <div class="tagline">A simple YouTube player</div>
  </header>

  <form class="search" id="videoForm">
    <input id="videoInput" type="text" autocomplete="off"
      placeholder="Paste a YouTube link or video ID" aria-label="YouTube link or video ID">
    <button type="submit">Play video</button>
  </form>

  <div style="text-align:center">
    <a class="youtube-link" href="https://www.youtube.com" target="_blank" rel="noopener">
      Open YouTube
    </a>
  </div>

  <section class="player" aria-label="Video player">
    <div class="placeholder" id="placeholder">Paste a YouTube link above to load a video.</div>
    <iframe id="player" title="YouTube video player"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen style="display:none"></iframe>
  </section>

  <div class="notice">
    Use only while safely parked. YouTube or the vehicle may restrict video playback while driving;
    this page does not bypass those restrictions.
  </div>
</main>

<script>
  const form = document.getElementById('videoForm');
  const input = document.getElementById('videoInput');
  const player = document.getElementById('player');
  const placeholder = document.getElementById('placeholder');

  function getVideoId(value) {
    const text = value.trim();
    if (/^[a-zA-Z0-9_-]{11}$/.test(text)) return text;
    try {
      const url = new URL(text);
      if (url.hostname === 'youtu.be' || url.hostname.endsWith('.youtu.be')) {
        return url.pathname.split('/').filter(Boolean)[0] || null;
      }
      if (url.hostname.includes('youtube.com')) {
        if (url.searchParams.get('v')) return url.searchParams.get('v');
        const parts = url.pathname.split('/').filter(Boolean);
        if (['embed', 'shorts', 'live'].includes(parts[0])) return parts[1] || null;
      }
    } catch (_) {}
    return null;
  }

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    const id = getVideoId(input.value);
    if (!id || !/^[a-zA-Z0-9_-]{11}$/.test(id)) {
      placeholder.textContent = 'That does not look like a valid YouTube video link or ID. Please try again.';
      placeholder.style.display = 'grid';
      player.style.display = 'none';
      player.src = '';
      return;
    }
    player.src = 'https://www.youtube-nocookie.com/embed/' + id;
    player.style.display = 'block';
    placeholder.style.display = 'none';
  });
</script>
</body>
</html>
